<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Symbol visual verification</title>
  <style>
    body{margin:0;background:#080808;color:#fff;font:12px system-ui;padding:12px}
    #summary{position:sticky;top:0;z-index:2;background:#111;padding:10px;border-radius:8px;margin-bottom:10px}
    #grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .card{background:#151515;border:1px solid #333;border-radius:8px;padding:6px;overflow:hidden}
    .card.bad{border-color:#ff4d4d}.label{opacity:.6;margin-bottom:4px}canvas{display:block;width:100%;height:92px}
  </style>
</head>
<body>
  <div id="summary">正在逐顆驗證…</div>
  <div id="grid"></div>
  <script type="module" src="/tests/symbol-visual.ts"></script>
</body>
</html>
