name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只給發布 Pages 需要的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個發布；後來的推送會取代排隊中的那一次，但不會中斷正在跑的
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # vite.config.ts 已經設成相對路徑，所以放在使用者名稱底下的子路徑也能正常載入
      #
      # 登入用的 Supabase 設定從 GitHub 的 Secrets 帶進來。
      # 在 repo 的 Settings → Secrets and variables → Actions 新增這兩筆：
      #   SUPABASE_URL              https://xxxx.supabase.co
      #   SUPABASE_PUBLISHABLE_KEY  sb_publishable_...
      #
      # 沒設也不會讓打包失敗 —— 只是 App 裡按登入會顯示「後端尚未設定」，
      # 其他功能照常。
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
