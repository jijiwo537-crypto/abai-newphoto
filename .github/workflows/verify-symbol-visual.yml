name: Verify every symbol visually

on:
  pull_request:
    paths:
      - 'utils/symbolGeometry.ts'
      - 'utils/symbols.ts'
      - 'components/CollageTool.tsx'
      - 'components/GridLayoutTool.tsx'
      - 'tests/symbol-visual.*'
      - 'playwright.config.ts'
      - '.github/workflows/verify-symbol-visual.yml'

jobs:
  symbol-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - name: Upload complete symbol contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symbol-contact-sheets
          path: test-results/symbol-contact-*.png
          if-no-files-found: ignore
