name: iOS App
# 在 GitHub 的 Mac 機器上打包 iOS App，不需要自己有 Mac。
#  - 每次都會：編譯一次、在 iPhone 模擬器裡開起來截圖（Actions 頁面的 Artifacts 可以下載截圖）。
#  - 手動執行並勾選 testflight：再簽名、上傳到 TestFlight，手機裝 TestFlight 就能安裝測試。
#    需要的 secrets（Settings → Secrets and variables → Actions）：
#      APPLE_TEAM_ID       開發者帳號的 Team ID
#      ASC_KEY_ID          App Store Connect API 金鑰的 Key ID
#      ASC_ISSUER_ID       App Store Connect API 的 Issuer ID
#      ASC_KEY_P8_BASE64   下載的 .p8 金鑰檔內容（base64）
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: '上傳到 TestFlight'
        type: boolean
        default: false
      scenarios:
        description: '模擬器自動測試要跑哪些情境（空白＝全部）'
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'utils/native.ts'
      - '.github/workflows/ios.yml'
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git apply .github/deploy-layout.patch
      # 鎖定檔是在 Linux 產生的，缺 Mac 版的建置元件（npm 的老問題），所以這裡不照鎖定檔裝
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - run: npx cap sync ios
      - name: 編譯（模擬器）
        # 編譯失敗一定要讓這一步變紅：輸出先存檔，失敗時把所有錯誤列出來
        run: |
          set -o pipefail
          if ! xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1; then
            grep -E "error:|warning: 找不到" xcodebuild.log | sort -u | head -80
            tail -30 xcodebuild.log
            exit 1
          fi
          grep -E "warning: .*(ABAI|Native|Haptics|VideoWriter|PhotoEditing)" xcodebuild.log | sort -u | head -40 || true
          test -d build/Build/Products/Debug-iphonesimulator/App.app
      - name: 在模擬器開起來截圖、跑自動測試
        # 每個情境（見 utils/nativeQA.ts）各開一次 App：App 自己點按鈕、開相簿、輸出影片，
        # 這裡每 4 秒截一張圖，最後把 App 寫的 ABAIQA 紀錄收成 shots/qa.log
        run: |
          DEV=$(xcrun simctl list devices available | grep -m1 -E 'iPhone 1[5-9]( Pro)? \(' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/App.app
          # 相簿權限先給好（完整取用＋加入），自動測試才不會停在系統的詢問框。
          # simctl privacy 對照片的「完整取用」在新版模擬器上不一定生效，所以直接寫進模擬器的權限資料庫，再重開模擬器
          xcrun simctl privacy "$DEV" grant photos com.abai.photo || true
          TCC=~/Library/Developer/CoreSimulator/Devices/$DEV/data/Library/TCC/TCC.db
          for svc in kTCCServicePhotos kTCCServicePhotosAdd; do
            sqlite3 "$TCC" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags) VALUES ('$svc','com.abai.photo',0,2,2,1,0);" || true
          done
          sqlite3 "$TCC" "select service, client, auth_value from access where client='com.abai.photo'" || true
          xcrun simctl shutdown "$DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          mkdir -p shots
          xcrun simctl launch "$DEV" com.abai.photo -AppleLanguages '(zh-Hant)' -AppleLocale zh_TW
          sleep 15; xcrun simctl io "$DEV" screenshot shots/0-launch.png
          run_qa() {
            tag=$(echo "$1" | tr ':' '-')
            xcrun simctl terminate "$DEV" com.abai.photo >/dev/null 2>&1 || true
            sleep 1
            xcrun simctl launch "$DEV" com.abai.photo -abaiQA "$1" -AppleLanguages '(zh-Hant)' -AppleLocale zh_TW
            for i in $(seq 1 $(( $2 / 4 ))); do
              sleep 4; xcrun simctl io "$DEV" screenshot "shots/$tag-$(printf %02d $i).png" >/dev/null 2>&1 || true
            done
          }
          LIST="${{ inputs.scenarios }}"
          [ -z "$LIST" ] && LIST="save:40 video:60 tool:art:32 tool:dot:32 tool:edit:32 tool:beauty:32 tool:match:32 tool:collage:32 tool:layout:32 layoutvideo:150 gallery:32"
          # 相簿情境放最後：模擬器會跳系統的權限詢問框，而且框會一直留在畫面上
          for item in $LIST; do run_qa "${item%:*}" "${item##*:}"; done
          DATA=$(xcrun simctl get_app_container "$DEV" com.abai.photo data 2>/dev/null || true)
          cp "$DATA/Documents/abaiqa.log" shots/qa.log 2>/dev/null || echo "沒有 abaiqa.log" > shots/qa.log
          xcrun simctl spawn "$DEV" log show --style compact --last 40m --predicate 'process == "App"' 2>/dev/null | grep -E "ABAIQA|⚡️|error|Error|JS Eval" | tail -600 > shots/app.log || true
          # 閃退紀錄（有的話）
          mkdir -p shots/crash
          find ~/Library/Logs/DiagnosticReports -name 'App*' -newer xcodebuild.log -exec cp {} shots/crash/ \; 2>/dev/null || true
          ls shots/crash
          cat shots/qa.log | head -400
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots
  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git apply .github/deploy-layout.patch
      # 鎖定檔是在 Linux 產生的，缺 Mac 版的建置元件（npm 的老問題），所以這裡不照鎖定檔裝
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - run: npx cap sync ios
      - name: 簽名、上傳 TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"; echo "$KEY_P8" | base64 --decode > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $AUTH archive | tail -40
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/out" $AUTH
