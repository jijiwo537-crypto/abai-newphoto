<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>ABAI</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
    <!-- 字型要先載：它們的網址寫在打包後的 CSS 裡，瀏覽器要先下載並解析那支
         CSS 才會發現它們，等於多繞一趟。先 preload 就會跟 CSS 同時開始下載，
         開場那一下不會先用系統字型畫一次再換過來。 -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Inter.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/PlayfairDisplay.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/MaterialSymbolsOutlined.woff2" crossorigin>
    <script>
        /* 字型還沒好之前先把畫面壓著，避免「先用系統字型畫一次、字型到了再跳一次」。

           這一段以前是等 document.fonts.load('12px "..."')。改成自己放字型之後
           那樣寫會失效 —— 這支腳本比 CSS 早執行，那時候 @font-face 還不存在，
           document.fonts 裡查無此字型會「立刻成功」，等於完全沒擋到。
           改成等 document.fonts.ready（所有字型載入動作結束才 resolve），
           並且真的確認圖示字型可用了才放行。 */
        (function () {
            var root = document.documentElement;
            if (!document.fonts) return;
            root.classList.add('fonts-loading');
            var done = false;
            function reveal() {
                if (done) return;
                done = true;
                root.classList.remove('fonts-loading');
                root.classList.add('fonts-loaded');
            }
            /* 一定要等 document.fonts.ready，不能用 document.fonts.check 輪詢：
               這支腳本比 CSS 早執行，那時候 @font-face 還不存在，
               check() 查一個不存在的字型會直接回 true（它認為退回系統字型就算可用），
               等於完全沒擋到 —— 這正是先前開場會閃一下系統字型的原因。 */
            function waitReady() {
                document.fonts.ready.then(function () {
                    if (document.fonts.check('24px "Material Symbols Outlined"')) reveal();
                    else setTimeout(waitReady, 60);
                }).catch(reveal);
            }
            waitReady();
            // 最多壓 1.2 秒，網路再慢也不能一直黑畫面
            setTimeout(reveal, 1200);
        })();
    </script>
    <style>
        *, *::before, *::after {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
        }
        input, textarea, [contenteditable="true"] {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }
        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            touch-action: manipulation;
        }
        .material-symbols-outlined {
            font-variation-settings: 'wght' 300, 'opsz' 24, 'FILL' 0;
        }
        /* Prevent layout shift and FOUT during font loading */
        html.fonts-loading .material-symbols-outlined {
            color: transparent !important;
            width: 24px !important;
            height: 24px !important;
            overflow: hidden !important;
            display: inline-block !important;
            white-space: nowrap !important;
        }
        html.fonts-loading body {
            opacity: 0 !important;
        }
        html.fonts-loaded body {
            opacity: 1 !important;
            transition: opacity 0.25s ease-in-out;
        }
        /* ─────────────────────────────────────────────
           電腦版：直接照手機的樣子顯示
           ─────────────────────────────────────────────
           每一頁都是照手機比例排的，拉滿寬螢幕會整個變形。這裡不另外設計
           電腦版，就是把畫面收成一支手機的寬度擺在正中央、兩側留黑，
           所以在電腦上看到的跟手機上一模一樣，方便對照檢查。

           框本身是完整的視窗高度，裡面用 100dvh 排版的頁面完全不用改。
           translateZ(0) 讓裡面 position:fixed 的全螢幕遮罩以框為基準，
           蓋在框裡而不是整個螢幕。

           條件是「夠寬」而且「有精準游標」—— 手機轉成橫向時寬度也會超過 768px，
           光看寬度會把橫向的手機也框起來。加上 hover/pointer 的條件之後，
           只有滑鼠操作的裝置會套用，任何觸控裝置一個像素都不會動到。 */
        @media (min-width: 768px) and (hover: hover) and (pointer: fine) {
            .abai-shell {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000;
                overflow: hidden;
            }
            .abai-frame {
                position: relative;
                width: 390px;
                height: 100dvh;
                overflow: hidden;
                background: #000;
                transform: translateZ(0);
                box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
            }
        }
        .shutter-btn-outer {
            box-shadow: 0 0 0 4px #000, 0 0 0 6px #fff;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-black text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
