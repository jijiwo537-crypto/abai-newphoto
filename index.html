<!DOCTYPE html>
<html lang="zh-Hant" class="dark booting">
<head>
    <meta charset="utf-8"/>
    <style>html,body{background:#000;margin:0}#boot{background:#000}</style>
    <meta name="abai-build" content="20260912-layout-baseline-verified" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>ABAI</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=20260912b" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png?v=20260912b" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png?v=20260912b" />
    <!-- 「加到主畫面」之後就是一支獨立的 App：全螢幕、黑底、而且鎖直向。
         manifest 裡的 orientation 只有 Android 的安裝檔會真的照做，iOS 完全不理，
         所以底下還有一層自己畫的橫置擋板，兩邊才都擋得住。 -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS 必須在啟動時宣告 transparent 才允許首頁畫到狀態列下方；各工具
         既有的 safe-area 內距仍維持原座標，首頁只改狀態列底色、不移動內容。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ABAI" />
    <!-- 字型要先載：它們的網址寫在打包後的 CSS 裡，瀏覽器要先下載並解析那支
         CSS 才會發現它們，等於多繞一趟。先 preload 就會跟 CSS 同時開始下載，
         開場那一下不會先用系統字型畫一次再換過來。 -->
    <!-- 開場畫面那張圖：先下載，不然它自己也要等一趟 -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Inter.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/PlayfairDisplay.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/MaterialSymbolsOutlined.woff2" crossorigin>
    <!-- 預設文字字體在開場畫面期間就載妥。以前要等使用者第一次新增文字才
         開始請求，第一幀會先用 iOS fallback，完成後再換成 Noto Sans TC，
         看起來就是文字剛生成時抖一下。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap">
    <link rel="preload" as="image" href="./home-wordmark.png?v=20260912a" fetchpriority="high">
    <script>
        /* 字型還沒好之前先把畫面壓著，避免「先用系統字型畫一次、字型到了再跳一次」。

           這一段以前是等 document.fonts.load('12px "..."')。改成自己放字型之後
           那樣寫會失效 —— 這支腳本比 CSS 早執行，那時候 @font-face 還不存在，
           document.fonts 裡查無此字型會「立刻成功」，等於完全沒擋到。
           改成等 document.fonts.ready（所有字型載入動作結束才 resolve），
           並且真的確認圖示字型可用了才放行。 */
        (function () {
            var root = document.documentElement;
            if (!document.fonts) return;
            root.classList.add('fonts-loading');
            /* 主畫面不會自然用到 Noto Sans TC，所以只等 fonts.ready 並不會
               下載它；主動要求預設文字的兩個字重，開場的三秒同時完成暖機。 */
            try {
                document.fonts.load('400 40px "Noto Sans TC"');
                document.fonts.load('700 40px "Noto Sans TC"');
            } catch (e) { /* 舊版 WebKit 沒有完整 FontFaceSet 時照常啟動 */ }
            var done = false;
            function reveal() {
                if (done) return;
                done = true;
                root.classList.remove('fonts-loading');
                root.classList.add('fonts-loaded');
            }
            /* 一定要等 document.fonts.ready，不能用 document.fonts.check 輪詢：
               這支腳本比 CSS 早執行，那時候 @font-face 還不存在，
               check() 查一個不存在的字型會直接回 true（它認為退回系統字型就算可用），
               等於完全沒擋到 —— 這正是先前開場會閃一下系統字型的原因。 */
            function waitReady() {
                document.fonts.ready.then(function () {
                    if (document.fonts.check('24px "Material Symbols Outlined"')) reveal();
                    else setTimeout(waitReady, 60);
                }).catch(reveal);
            }
            waitReady();
            // 最多壓 1.2 秒，網路再慢也不能一直黑畫面
            setTimeout(reveal, 1200);

            /* ── 開場畫面 ────────────────────────────────────────────────
               ① 一點開就在（它是寫死在 HTML 裡的，第一次繪製就有）。
               ② **至少停 3 秒**，保留原本完整的品牌動畫節奏。
               ③ 3 秒到了還沒就緒就繼續顯示 Logo，等到 React 真的畫出
                  東西了才掀開（只等字型會在 App 還沒畫出來時掀開，中間閃一格空白）。
               ④ 這 3 秒不是白等的：底下的 warmUp() 會趁機把後面才要用到的
                  東西先弄好，之後進工具時就不會卡在那裡。 */
            var BOOT_MIN_MS = 3000;
            var bootT0 = Date.now();

            /* 開場畫面在的時候，手勢一律吃掉：不捲動、不縮放、不傳下去。
               passive:false 才 preventDefault 得動（touchmove 預設是被動的）。 */
            (function () {
                var el = document.getElementById('boot');
                if (!el) return;
                var eat = function (e) { if (e.cancelable) e.preventDefault(); };
                el.addEventListener('touchmove', eat, { passive: false });
                el.addEventListener('wheel', eat, { passive: false });
                el.addEventListener('touchstart', eat, { passive: false });
            })();

            function hideBoot() {
                var el = document.getElementById('boot');
                if (!el || el.dataset.going) return;
                el.dataset.going = '1';
                /* 主頁要先完整放在開場遮罩後面，接著才把黑色遮罩淡掉。

                   舊邏輯直到 0.5 秒淡出結束仍保留 html.booting，因此 #root 一直是
                   visibility:hidden；畫面上雖然在跑 opacity，下面其實只有黑底，
                   遮罩刪除的最後一幀才硬切出主頁。字型完成時間不同時，偶爾又會
                   剛好吃到 #root 自己的 transition，才造成「有時漸顯、有時硬切」。

                   boot-revealing 會取消 #root 自己那條不確定時序的 transition，
                   讓已完成的主頁先穩定停在後面；使用者看到的漸顯只由 #boot 這一條
                   0.5 秒動畫負責，所以每一次啟動都完全一致。 */
                root.classList.add('boot-revealing');
                root.classList.remove('booting');
                /* 淡出的這 0.5 秒它還蓋在上面，這時候就要放行了，
                   不然看得到首頁卻按不動，那半秒會以為 App 當掉。 */
                el.style.pointerEvents = 'none';
                /* 保險：萬一開場那段仍有東西把頁面捲下去了，收掉之前歸零。
                   首頁那條捲軸是 .home-scroll（見 HomePage）。 */
                try {
                    var sc = document.querySelector('.home-scroll');
                    if (sc && sc.scrollTop) sc.scrollTop = 0;
                } catch (err) { /* 沒有就算了 */ }
                /* 先讓瀏覽器提交一幀「主頁已在遮罩後方、遮罩仍完全不透明」，
                   下一幀才開始淡出。這可避免 WebKit 把兩次樣式改動合併成硬切。 */
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        el.style.opacity = '0';
                        setTimeout(function () {
                            el.remove();
                            root.classList.remove('boot-revealing');
                        }, 500);
                    });
                });
            }
            function tryHide() {
                var wait = BOOT_MIN_MS - (Date.now() - bootT0);
                if (wait > 0) { setTimeout(tryHide, wait); return; }
                // 收掉之前先讓瀏覽器畫兩格，確定首頁那一屏已經在畫面上了
                requestAnimationFrame(function () { requestAnimationFrame(hideBoot); });
            }
            function whenReady() {
                var r = document.getElementById('root');
                var brand = document.querySelector('img[data-home-wordmark]');
                var brandReady = !brand || (brand.complete && brand.naturalWidth > 0);
                /* 開場遮罩收掉前，首頁字標也必須已經解碼完成。這張圖在 head 已
                   高優先預載，通常不增加等待；網路較慢時則寧可多留一下開場，
                   不讓使用者先看到空位、下一幀才突然補出品牌字。 */
                if (root.classList.contains('fonts-loaded') && r && r.childElementCount > 0 && brandReady) { tryHide(); return; }
                setTimeout(whenReady, 50);
            }
            whenReady();
            /* 舊版在 3.5 秒直接 hideBoot：若新版 JS 尚未下載完成，Logo 先被
               移除、#root 又仍是空的，使用者就只會看到一段黑畫面。保險機制
               現在只略過字型／首頁字標等待，**絕不在 App 尚未掛載時掀開**。 */
            setTimeout(function forceRevealWhenMounted() {
                var r = document.getElementById('root');
                if (r && r.childElementCount > 0) {
                    root.classList.remove('fonts-loading');
                    root.classList.add('fonts-loaded');
                    tryHide();
                    return;
                }
                setTimeout(forceRevealWhenMounted, 100);
            }, 3500);

            /* ── 趁開場那幾秒先暖機 ──────────────────────────────────────
               這幾樣都是「第一次用的時候特別慢，之後就順了」的東西。
               先在這裡踩一遍，使用者實際點下去的時候就已經是熱的。

               每一項都包在 try 裡、也都不影響畫面 —— 失敗就算了，
               開場畫面照樣會收掉，App 照樣能用。 */
            function warmUp() {
                /* ① WebGL：第一次建立繪圖環境＋編譯著色器是實打實的一段時間
                      （濾鏡、美顏、仿色都靠它）。先建一個小的、編一支最簡單的
                      著色器，把驅動叫醒之後立刻丟掉。 */
                try {
                    var cv = document.createElement('canvas');
                    cv.width = cv.height = 2;
                    var gl = cv.getContext('webgl2') || cv.getContext('webgl');
                    if (gl) {
                        var vs = gl.createShader(gl.VERTEX_SHADER);
                        gl.shaderSource(vs, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}');
                        gl.compileShader(vs);
                        var fs = gl.createShader(gl.FRAGMENT_SHADER);
                        gl.shaderSource(fs, 'precision mediump float;void main(){gl_FragColor=vec4(1.);}');
                        gl.compileShader(fs);
                        var pr = gl.createProgram();
                        gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
                        gl.clear(gl.COLOR_BUFFER_BIT);
                        var lose = gl.getExtension('WEBGL_lose_context');
                        if (lose) lose.loseContext();
                    }
                    cv.width = cv.height = 0;
                } catch (e) { /* 沒有 WebGL 也不影響，那些功能自己有 CPU 的退路 */ }

                /* ② 2D 畫布與圖片解碼：createImageBitmap 第一次呼叫要起一條解碼執行緒，
                      幾乎每個工具載照片時都會走到。 */
                try {
                    var c2 = document.createElement('canvas');
                    c2.width = c2.height = 8;
                    var x2 = c2.getContext('2d', { willReadFrequently: true });
                    if (x2) { x2.fillRect(0, 0, 8, 8); x2.getImageData(0, 0, 8, 8); }
                    if (typeof createImageBitmap === 'function' && c2.toBlob) {
                        c2.toBlob(function (b) {
                            if (!b) return;
                            createImageBitmap(b).then(function (bm) { bm.close && bm.close(); }).catch(function () {});
                        });
                    }
                } catch (e) { /* ignore */ }

                /* ③ IndexedDB：**刻意不預先打開**。
                      這裡本來有一行 open('abai-exports') 與 open('abai-tools')。
                      不帶版本號的 open 會把資料庫直接建成「第 1 版、
                      裡面一個 store 都沒有」，而 toolDraft / exportHistory 是用
                      open(名稱, 1) 打開的 —— 版本一樣，onupgradeneeded 就永遠不會跑，
                      store 永遠不存在，於是每一次寫入都被靜靜吞掉：
                      草稿存不進去、歷史紀錄永遠是空的。
                      更糟的是這個連線開了之後沒有關，後來想升級版本補建 store
                      也會被它擋住（onblocked），所以連修復都時好時壞。
                      省下的那點時間遠不及代價，直接拿掉；兩個模組自己
                      第一次用到時會用正確的方式建好。 */

                /* ④ 濾鏡檔（LUT）：一支 300KB 左右，第一次點濾鏡時要現載，
                      那一下就是明顯的卡頓。先抓前三支放進瀏覽器快取。
                      行動網路上使用者若開了「節省數據」或訊號很差就不抓 ——
                      這是體驗的加分項，不該替人決定花流量。 */
                try {
                    var conn = navigator.connection || {};
                    var slow = conn.saveData === true || /(^|-)2g$/.test(conn.effectiveType || '');
                    if (!slow) {
                        ['./luts/f1.webp', './luts/f2.webp', './luts/f3.webp'].forEach(function (u) {
                            fetch(u, { cache: 'force-cache', priority: 'low' }).catch(function () {});
                        });
                    }
                } catch (e) { /* ignore */ }
            }
            /* 晚一點才開始暖機：讓主程式先下載、先畫出首頁，
               不要跟它搶同一段時間 —— 暖機是拿來填剩下那幾秒的。 */
            setTimeout(warmUp, 700);
        })();
    </script>
    <style>
        *, *::before, *::after {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
        }
        input, textarea, [contenteditable="true"] {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
            /* 上面那條 * 規則把整個 App 的長按選單關掉了（不想在照片、按鈕上
               長按就跳出「拷貝圖片」那種東西）。但輸入欄不能跟著關 ——
               iOS 的全選／剪下／拷貝／貼上就是那個選單，關掉之後長按輸入欄
               什麼都不會發生。所以這裡把它明確開回來。 */
            -webkit-touch-callout: default !important;
        }
        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            touch-action: manipulation;
        }
        .material-symbols-outlined {
            font-variation-settings: 'wght' 300, 'opsz' 24, 'FILL' 0;
        }
        /* Prevent layout shift and FOUT during font loading */
        html.fonts-loading .material-symbols-outlined {
            color: transparent !important;
            width: 24px !important;
            height: 24px !important;
            overflow: hidden !important;
            display: inline-block !important;
            white-space: nowrap !important;
        }
        /* 字型還沒好之前壓著的是 App 本體（#root），不是整個 body ——
           開場那張 logo 要照樣看得見，它就是拿來填這一段空白的。 */
        html.fonts-loading #root {
            opacity: 0 !important;
        }
        html.fonts-loaded #root {
            opacity: 1 !important;
            transition: opacity 0.25s ease-in-out;
        }
        /* 開場遮罩尚未完整退場时，首頁本體連版面都不發布；這層比單純
           opacity 更可靠，能擋住 iOS PWA 偶發露出的底部安全區。 */
        html.booting #root {
            opacity: 0 !important;
            visibility: hidden !important;
        }
        /* 開場退場時，首頁已經完整放在遮罩後方；漸顯只交給 #boot 的 opacity，
           不再讓字型載入完成時間決定 #root 是否另外跑一次動畫。 */
        html.boot-revealing #root {
            opacity: 1 !important;
            visibility: visible !important;
            transition: none !important;
        }
        /* ─────────────────────────────────────────────
           電腦版：直接照手機的樣子顯示
           ─────────────────────────────────────────────
           每一頁都是照手機比例排的，拉滿寬螢幕會整個變形。這裡不另外設計
           電腦版，就是把畫面收成一支手機的寬度擺在正中央、兩側留黑，
           所以在電腦上看到的跟手機上一模一樣，方便對照檢查。

           框本身是完整的視窗高度，裡面用 100dvh 排版的頁面完全不用改。
           translateZ(0) 讓裡面 position:fixed 的全螢幕遮罩以框為基準，
           蓋在框裡而不是整個螢幕。

           條件是「夠寬」而且「有精準游標」—— 手機轉成橫向時寬度也會超過 768px，
           光看寬度會把橫向的手機也框起來。加上 hover/pointer 的條件之後，
           只有滑鼠操作的裝置會套用，任何觸控裝置一個像素都不會動到。 */
        @media (min-width: 768px) and (hover: hover) and (pointer: fine) {
            .abai-shell {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000;
                overflow: hidden;
            }
            .abai-frame {
                position: relative;
                width: 390px;
                height: 100dvh;
                overflow: hidden;
                background: #000;
                transform: translateZ(0);
                box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
            }
        }
        /* ─────────────────────────────────────────────
           禁止橫置
           ─────────────────────────────────────────────
           每一頁都是照直向手機的比例排的。橫過來寬高互換，工具列會擠成一條、
           預覽區被壓扁 —— 就是「介面跑掉」。這裡不替橫向另外排一套版，
           直接整片蓋掉並請使用者轉回來。

           是「蓋住」不是把 #root 藏起來：藏起來的話裡面每一塊會自己量尺寸的
           畫布（編輯、拼圖那些）在橫向時都會量到 0，轉回直向還得重算一輪才正常。
           蓋一層就只是看不到，底下的排版照樣跟著螢幕走，轉回來就是原樣。

           條件用 pointer: coarse（主要輸入是手指）而不是看寬高比：
           電腦視窗拉扁也算 landscape，但電腦上本來就是用上面那個 390px 的
           框在看，不該被擋。 */
        #orientation-guard {
            display: none;
        }
        @media (orientation: landscape) and (pointer: coarse) {
            #orientation-guard {
                position: fixed;
                inset: 0;
                z-index: 2147483647;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
                padding: 24px;
                background: #000;
                color: #fff;
                text-align: center;
                touch-action: none;
                overscroll-behavior: none;
            }
        }
        #orientation-guard p {
            margin: 0;
        }
        #orientation-guard .og-phone {
            color: rgba(255, 255, 255, 0.9);
            animation: og-turn 2.8s ease-in-out infinite;
        }
        @keyframes og-turn {
            0%, 20%  { transform: rotate(-90deg); }
            45%, 80% { transform: rotate(0deg); }
            100%     { transform: rotate(-90deg); }
        }
        #orientation-guard .og-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.1em;
        }
        @media (prefers-reduced-motion: reduce) {
            #orientation-guard .og-phone {
                animation: none;
                transform: none;
            }
        }
        /* ─────────────────────────────────────────────
           開場畫面
           ─────────────────────────────────────────────
           字型要等（最多 1.2 秒）、打包好的程式也要下載＋解析，這一段本來就是
           一片全黑 —— 這裡只是把那片黑換成有 logo 的黑，沒有多拖任何時間。

           寫死在 HTML 裡而不是做成 React 元件：它要在「React 都還沒開始跑」的
           時候就看得到，做成元件就一定會晚一步。 */
        #boot {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            height: 100lvh;
            z-index: 9998;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 與 iOS 原生啟動畫面使用相同的固定幾何中心。舊版靠 14vh padding
               推位置，WebKit 在 safe-area 初始化時會重算內容高度，Logo 便會
               由上往下跳一下。固定盒模型後全程不再重排。 */
            padding: 0;
            box-sizing: border-box;
            opacity: 1;
            transition: opacity 0.45s ease;
            /* 開場畫面**要接手勢**（以前是 pointer-events:none）。
               底下的 #root 雖然是 opacity:0，卻還是一個能捲動的頁面 ——
               手指在 logo 上滑一下，滑到的其實是看不見的首頁。
               開場畫面收掉時首頁已經被捲到下面去了，那正是「一進主頁就在中間」。
               這裡把手勢擋在這一層：touch-action:none 讓瀏覽器不要把它當捲動，
               下面的 JS 再把 touchmove／wheel 收掉，一個像素都傳不下去。 */
            pointer-events: auto;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #boot img {
            /* 圖本身就是黑底，跟背景接得剛剛好，看不出邊 */
            width: 252px;
            height: 252px;
            animation: none;
            opacity: 1;
            /* 視覺中心要比幾何中心略高；固定像素位移不會受 safe-area 重算影響。 */
            transform: translate3d(0, -18px, 0);
            transform-origin: 50% 50%;
            backface-visibility: hidden;
            contain: strict;
        }
        @media (prefers-reduced-motion: reduce) {
            #boot img { animation: none; opacity: 1; }
        }
        .shutter-btn-outer {
            box-shadow: 0 0 0 4px #000, 0 0 0 6px #fff;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>

    <div id="root"></div>
    <!-- 橫置擋板。故意寫在 HTML 裡而不是做成 React 元件：
         它要能蓋住每一頁（首頁、編輯、拼圖…），而且不管 App 當下是什麼狀態
         都得出得來，跟 React 的畫面完全脫鉤最保險。顯示與否純粹交給 CSS 判斷，
         沒有任何 JS 參與，所以轉的當下就到位，不會晚一拍。 -->
    <div id="orientation-guard" aria-hidden="true">
        <svg class="og-phone" width="62" height="92" viewBox="0 0 62 92" fill="none" aria-hidden="true">
            <rect x="2.5" y="2.5" width="57" height="87" rx="12" stroke="currentColor" stroke-width="3"/>
            <rect x="23" y="9" width="16" height="3" rx="1.5" fill="currentColor" opacity="0.75"/>
            <rect x="22" y="79" width="18" height="3" rx="1.5" fill="currentColor" opacity="0.45"/>
        </svg>
        <p class="og-title">請把裝置轉回直向</p>
    </div>
    <script>
        /* Android 上安裝成 App 之後，這一行才是真的把螢幕鎖住（連轉都轉不動）；
           manifest 的 orientation 只是宣告，鎖起來要靠它。
           在 Safari／iOS 沒有這支 API，在一般瀏覽器分頁裡也會被拒絕 ——
           兩種都會丟例外或回傳被拒的 Promise，這裡全部吞掉，
           擋板照樣會蓋，功能不受影響。 */
        (function () {
            try {
                var o = window.screen && window.screen.orientation;
                if (o && typeof o.lock === 'function') {
                    var r = o.lock('portrait');
                    if (r && typeof r.catch === 'function') r.catch(function () {});
                }
            } catch (e) {}
        })();
    </script>
